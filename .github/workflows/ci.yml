name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs anteriores de la misma rama/PR cuando llega un push nuevo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        # Cachea dependencias y artefactos de Gradle para acelerar los runs.
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compile + checkstyle + pmd + spotless + test)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        # Sube los reportes aunque el build falle, para poder inspeccionarlos.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/test"
          if-no-files-found: ignore
          retention-days: 7
