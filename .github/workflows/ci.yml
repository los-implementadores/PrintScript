name: CI/CD

# Un solo pipeline. En un PR, verifica. En main y en tags v*, verifica y publica.
# Lo que se publica sale del mismo build que corrió los tests (build once): no se
# vuelve a compilar para empaquetar ni para subir los paquetes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # En un PR, un push nuevo cancela la corrida vieja. En main y en tags nunca se
  # cancela, para no cortar una publicación a la mitad.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build & Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # El código de un PR corre sin permisos de escritura.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        # Cachea dependencias y valida el checksum del Gradle wrapper.
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compile + spotless + checkstyle + pmd + test)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        # Sube los reportes aunque el build falle, para poder inspeccionarlos.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/test"
          if-no-files-found: ignore
          retention-days: 7

  build-and-publish:
    name: Build, Test & Publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # crear el GitHub Release (solo en tags)
      packages: write # publicar en GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        # En un tag vX.Y.Z la versión sale del tag; en main, de gradle.properties (SNAPSHOT).
        # El tag se valida antes de usarlo: una versión de release mal escrita no se puede volver
        # a publicar en GitHub Packages. Además, el valor nunca se inserta como expresión dentro de un
        # script: se pasa por env.
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::El tag $GITHUB_REF_NAME no tiene la forma vX.Y.Z"
              exit 1
            fi
            echo "gradle-args=-Pversion=$VERSION" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(grep '^version=' gradle.properties | cut -d= -f2)"
            echo "gradle-args=" >> "$GITHUB_OUTPUT"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión: $VERSION"

      - name: Extract release notes from CHANGELOG
        # Antes de compilar: un release sin su sección en el CHANGELOG no se publica.
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md no tiene una sección para la versión $VERSION"
            exit 1
          fi

      - name: Build, test and package
        run: ./gradlew build :cli:distZip $GRADLE_ARGS --no-daemon --stacktrace
        env:
          GRADLE_ARGS: ${{ steps.version.outputs.gradle-args }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/test"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload CLI artifact
        # En cada push (main o tag) deja el zip descargable desde Actions.
        uses: actions/upload-artifact@v4
        with:
          name: printscript-cli-${{ steps.version.outputs.value }}
          path: cli/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        # Solo en tags v*: el mismo zip, con las notas del CHANGELOG. Va antes de publicar los
        # paquetes porque publicar es lo único que no se puede repetir: si algo falla acá, el
        # re-run no choca con una versión ya publicada.
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: cli/build/distributions/*.zip
          body_path: release-notes.md

      - name: Publish to GitHub Packages
        # Mismo workspace y mismos argumentos que el build: Gradle encuentra los jars al día y
        # publica esos, sin volver a compilar (build once).
        run: ./gradlew publish $GRADLE_ARGS --no-daemon --stacktrace
        env:
          GRADLE_ARGS: ${{ steps.version.outputs.gradle-args }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
