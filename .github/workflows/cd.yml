name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

# Permisos necesarios para crear Releases y publicar en GitHub Packages con el GITHUB_TOKEN.
permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package CLI
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build CLI distribution
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
            echo "Empaquetando CLI para release version $VERSION..."
            ./gradlew :cli:distZip -Pversion="$VERSION" --no-daemon --stacktrace
          else
            echo "Empaquetando CLI con version por defecto..."
            ./gradlew :cli:distZip --no-daemon --stacktrace
          fi

      - name: Upload CLI artifact
        # En cada push (main o tag) deja el zip descargable desde Actions.
        uses: actions/upload-artifact@v4
        with:
          name: printscript-cli
          path: cli/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        # Solo cuando el push es un tag v* (ej. v1.0.0).
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: cli/build/distributions/*.zip
          generate_release_notes: true

  publish-packages:
    name: Publish Packages to GitHub Packages
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check and Publish to GitHub Packages
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
            echo "Publicando release version $VERSION a GitHub Packages..."
            ./gradlew check publish -Pversion="$VERSION" --no-daemon --stacktrace
          else
            echo "Publicando version snapshot a GitHub Packages..."
            ./gradlew check publish --no-daemon --stacktrace
          fi
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

